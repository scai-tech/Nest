name: nestenv
channels:
  - conda-forge
  - nvidia
  - defaults
  - nvidia/label/cuda-12.4.0

dependencies:
  # Core Python version
  - python=3.10

  # System-level libraries
  - pip
  - ncurses
  - yaml-cpp
  - libconfig
  - boost
  - scons
  - graphviz
  - pygraphviz
  - python-graphviz
  - gcc_linux-64=12.4.0
  - libcxx
  - gxx_linux-64=12.4.0
  - sysroot_linux-64

  # CUDA tools
  - cuda-nvcc=12.4
  - cuda-tools=12.4
  - cuda-toolkit=12.4
  - cudnn=9.7.1.26

  - pybind11
  - ninja
  - networkx
  - six
  - git-lfs

  - pip:
      - matplotlib
      - transformers==4.45.2
      - accelerate
      - wandb
      - numpy==2.2.6
      - scipy==1.15.2
      - protobuf==5.29.3
      - einops
      - gurobipy
      - sentencepiece